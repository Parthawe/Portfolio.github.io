<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Public preview project cover</title>
  <desc id="desc">Neutral cover art for portfolio work with deeper case-study details available by request.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6f0"/>
      <stop offset="0.5" stop-color="#ece8de"/>
      <stop offset="1" stop-color="#d9d3c8"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34343a" stop-opacity="0.12"/>
      <stop offset="0.42" stop-color="#34343a" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="cardShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#blueWash)"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>

  <g fill="none" stroke="#111" stroke-opacity="0.14" stroke-width="1">
    <path d="M120 130H1480V870H120z"/>
    <path d="M120 250H1480M120 750H1480M260 130V870M1340 130V870"/>
    <path d="M210 190H1390" stroke-dasharray="3 13"/>
    <path d="M210 810H1390" stroke-dasharray="3 13"/>
  </g>

  <g transform="translate(448 286)">
    <rect x="0" y="0" width="704" height="428" rx="34" fill="url(#cardShade)" stroke="#111" stroke-opacity="0.14"/>
    <path d="M72 104H436M72 164H632M72 224H514M72 284H584" stroke="#111" stroke-opacity="0.18" stroke-width="22" stroke-linecap="round"/>
    <path d="M70 346H628" stroke="#34343a" stroke-opacity="0.52" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(476 60)" fill="none" stroke="#111" stroke-opacity="0.24" stroke-width="2">
      <rect x="0" y="0" width="110" height="128" rx="18"/>
      <path d="M24 30H86M24 56H74M24 82H92"/>
    </g>
    <g transform="translate(534 198)" fill="none" stroke="#34343a" stroke-opacity="0.42" stroke-width="4" stroke-linecap="round">
      <path d="M0 80C38 14 82 11 126 70S210 106 250 22"/>
      <path d="M22 100C62 64 106 56 158 94"/>
    </g>
  </g>

  <g fill="#111">
    <text x="120" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="10" opacity="0.62">QUICK GLIMPSE</text>
    <text x="120" y="815" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="7" opacity="0.42">PUBLIC PREVIEW</text>
    <text x="1480" y="815" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="7" opacity="0.42">FULL DETAILS BY REQUEST</text>
  </g>
</svg>
