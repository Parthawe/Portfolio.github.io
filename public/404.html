<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect
      // Save the full URL then redirect to index.html
      sessionStorage.redirect = location.href;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') + '/'
      );
    </script>
  </head>
  <body></body>
</html>
