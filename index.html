<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP notes: jsdelivr + wasm-unsafe-eval + blob workers are for the
      MediaPipe hand tracker; storage.googleapis.com hosts its model files.
      supabase.co is comments, api.elevenlabs.io is optional agent TTS,
      player.vimeo.com is case-study embeds, img-src https: covers the
      TransFi/Cargo external image CDNs. frame-ancestors is not enforceable
      via <meta>, so it is intentionally absent.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' data: https://api.fontshare.com https://cdn.fontshare.com; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-src https://player.vimeo.com; connect-src 'self' https://*.supabase.co https://api.elevenlabs.io https://cdn.jsdelivr.net https://storage.googleapis.com https://api.fontshare.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Parth Pawar — Design Engineer crafting AI wearables, fintech, and interactive systems. Head of UI/UX at Mentra. NYU ITP '24." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Parth Pawar, Design Engineer" />
    <meta property="og:description" content="Design Engineer specializing in AI wearables, fintech, and interactive systems. Head of UI/UX at Mentra. NYU ITP '24." />
    <meta property="og:image" content="https://designwhich.works/Assets/images/mentra.webp" />
    <meta property="og:url" content="https://designwhich.works/" />
    <meta property="og:site_name" content="Parth Pawar" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://designwhich.works/" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="icon" type="image/x-icon" href="/Assets/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/Assets/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <title>Parth Pawar — Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var path = params.get('p');
        if (!path) return;
        var restoredQuery = params.get('q');
        params.delete('p');
        params.delete('q');
        var query = restoredQuery || params.toString();
        window.history.replaceState(null, '', path + (query ? '?' + query : '') + window.location.hash);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
