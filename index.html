<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/Assets/images/favicon.ico" />
    <link rel="apple-touch-icon" href="/Assets/images/mentra.png" />
    <title>Parth Pawar — Product Designer</title>
    <meta name="description" content="Product designer crafting human-centered digital experiences — AI wearables, fintech, creative technology." />
    <meta property="og:title" content="Parth Pawar — Product Designer" />
    <meta property="og:description" content="Product designer crafting human-centered digital experiences." />
    <meta property="og:image" content="https://www.designwhich.works/Assets/images/mentra.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Prevent FOUC: apply theme before render
      (function() {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = 'dark';
        document.documentElement.classList.add(theme);
      })();
      // GitHub Pages SPA redirect: restore path from sessionStorage
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect) {
          var url = new URL(redirect);
          if (url.pathname !== location.pathname) {
            history.replaceState(null, '', url.pathname + url.search + url.hash);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
