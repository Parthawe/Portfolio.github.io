name: Verify pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-cover-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_EXPERIENCE_PREVIEWS_ENABLED: '1'
      QA_BASE_URL: http://127.0.0.1:4176
      QA_BASE_REV: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Keep all Shuffle sources unchanged
        run: |
          git diff --exit-code "$QA_BASE_REV" -- \
            src/pages/projects/ShufflePage.tsx \
            src/pages/ShuffleSimulationPage.tsx \
            src/components/ShuffleInteractive.tsx \
            src/components/shuffle/
      - run: bun run build
      - name: Verify cover playback, touch entry and startup stability
        run: |
          mkdir -p qa-diagnostics
          bun run preview --host 127.0.0.1 --port 4176 > qa-diagnostics/cover-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$QA_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$QA_BASE_URL" > /dev/null
          status=0
          QA_OUTPUT_DIR=qa-diagnostics/cover-motion node scripts/cover-motion-qa.mjs || status=1
          QA_OUTPUT_DIR=qa-diagnostics/cover-entry node scripts/cover-entry-qa.mjs || status=1
          QA_OUTPUT_DIR=qa-diagnostics/cover-artwork node scripts/cover-artwork-qa.mjs || status=1
          QA_OUTPUT_DIR=qa-diagnostics/cover-startup node scripts/cover-startup-qa.mjs || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cover-motion-verification
          path: qa-diagnostics/

  verify:
    env:
      VITE_EXPERIENCE_PREVIEWS_ENABLED: '1'
      QA_EXPERIENCE_PREVIEWS_ENABLED: '1'
      # Test-only reviewer code (qa-original-slides); never used by deploy.yml.
      VITE_NDA_ACCESS_SHA256: '9022e2445b567f5928a3bb03742867cb8bba427ac1dbe0b25c2dd2e5e008b990'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Check lossless hero lighting and preload guards
        run: |
          node scripts/hero-environment-qa.mjs
          node scripts/hero-early-preload-qa.mjs
          node scripts/hero-preload-qa.mjs
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run design:audit
      - run: bun run test:agent
      - run: bun run test:analytics
      - run: node --test scripts/qa-network-policy.test.mjs
      - name: Check rendered pages and project interactions
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_RENDERED_REPORT_PATH: pr-rendered.md
          QA_PERFORMANCE_REPORT_PATH: pr-performance.json
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$QA_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$QA_BASE_URL" > /dev/null
          status=0
          QA_OUTPUT_DIR=qa-diagnostics/case-study-slides node scripts/case-study-slides-qa.mjs || status=1
          QA_OUTPUT_DIR=qa-diagnostics/glassly node scripts/glassly-case-study-qa.mjs || status=1
          bun run qa:home-loading || status=1
          node scripts/reveal-readiness-qa.mjs || status=1
          node scripts/performance-qa.mjs || status=1
          bun run qa:physical-worlds || status=1
          node scripts/responsive-marquee-qa.mjs || status=1
          node scripts/work-loading-qa.mjs || status=1
          bun run qa:project-pages || status=1
          bun run qa:rendered || status=1
          node scripts/interaction-qa.mjs || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pull-request-verification
          path: |
            pr-rendered.md
            pr-performance.json
            /tmp/preview.log
            qa-diagnostics/
            /tmp/portfolio-physical-worlds-qa
            /tmp/portfolio-home-loading-qa

  verify-experiences:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_EXPERIENCE_PREVIEWS_ENABLED: '1'
      QA_EXPERIENCE_PREVIEWS_ENABLED: '1'
      QA_BASE_URL: http://127.0.0.1:4174
      QA_DEV_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Check mechanism geometry and behavior
        run: |
          node scripts/build-stage-anatomy.mjs --audit
          node scripts/build-stage-details.mjs --audit
          bun scripts/jugalbandi-anatomy-model-qa.mjs
      - run: bun run build
      - name: Verify curated experiences and original-source interactions
        run: |
          bun run preview --host 127.0.0.1 --port 4174 > /tmp/experience-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$QA_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$QA_BASE_URL" > /dev/null
          node scripts/experience-directory-qa.mjs
          node scripts/experience-directory-return-qa.mjs
          node scripts/stage-anatomy-qa.mjs
          node scripts/mentra-source-qa.mjs
          node scripts/jugalbandi-anatomy-qa.mjs
          node scripts/anatomy-scroll-qa.mjs
          node scripts/project-prototypes-qa.mjs
          node scripts/case-study-interactions-qa.mjs
          node scripts/interface-sources-qa.mjs
          node scripts/work-controls-review-qa.mjs
          bun run qa:enigma-tablet
          bun run qa:black-hole-time-trap
          bun run qa:moniac-hydraulic
          bun run qa:jugalbandi-duet
          bun run qa:jugalbandi-ensemble
          bun run qa:jugalbandi-verify
          bun run qa:omakase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-verification
          path: |
            /tmp/experience-preview.log
            /tmp/experience-directory-qa/
            /tmp/stage-anatomy-qa/
            /tmp/mentra-source-qa/
            /tmp/jugalbandi-anatomy-qa/
            /tmp/anatomy-scroll-qa/
            /tmp/portfolio-prototypes-qa/
            /tmp/case-study-interactions/
            /tmp/work-controls-review/
            /tmp/interface-sources-qa/
            /tmp/enigma-tablet-edges/
            /tmp/jugalbandi-full-verification/
            /tmp/moniac-hydraulic-qa/

  verify-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_EXPERIENCE_PREVIEWS_ENABLED: '1'
      QA_EXPERIENCE_PREVIEWS_ENABLED: '1'
      # Same public test fixture as verify; never used by deploy.yml.
      VITE_NDA_ACCESS_SHA256: '9022e2445b567f5928a3bb03742867cb8bba427ac1dbe0b25c2dd2e5e008b990'
      # Browser tests intercept this local transport; no model service is called.
      VITE_EDGE_AI_ENABLED: '1'
      VITE_EDGE_AI_ENDPOINT: '/api/folio-answer'
      QA_BASE_URL: http://127.0.0.1:4175
      QA_BASE_REV: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Verify approved experiences and source boundaries
        run: bun scripts/evidence-corrections-qa.ts
      - run: bun run build
      - name: Keep the deployed footer and protected assets unchanged
        run: |
          node scripts/release-without-footer-qa.mjs
          node scripts/guarded-build-qa.mjs
      - name: Verify case-study reading and recovery
        run: |
          bun run preview --host 127.0.0.1 --port 4175 > /tmp/reading-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$QA_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$QA_BASE_URL" > /dev/null
          node scripts/case-study-reading-qa.mjs
          node scripts/companion-decisions-qa.mjs
          node scripts/product-decisions-qa.mjs
          node scripts/service-decisions-qa.mjs
          node scripts/mechanism-case-decisions-qa.mjs
          node scripts/practice-evidence-qa.mjs
          node scripts/portfolio-consistency-review.mjs
          node scripts/chat-easter-entry-qa.mjs
          QA_OUTPUT_DIR=/tmp/chat-usability-qa node scripts/chat-usability-qa.mjs
          QA_OUTPUT_DIR=/tmp/chat-completion-qa node scripts/chat-completion-recovery-qa.mjs
          QA_OUTPUT_DIR=/tmp/chat-recovery-qa node scripts/live-ai-chat-recovery-qa.mjs
          node scripts/site-refinement-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-verification
          path: |
            /tmp/reading-preview.log
            /tmp/reading-quality-qa/
            /tmp/companion-decisions-qa/
            /tmp/product-decisions-qa/
            /tmp/service-decisions-qa/
            /tmp/mechanism-case-decisions-qa/
            /tmp/practice-evidence-qa/
            /tmp/portfolio-consistency-review/
            /tmp/chat-usability-qa/
            /tmp/chat-completion-qa/
            /tmp/chat-recovery-qa/
            /tmp/portfolio-site-refinement/
