name: Verify pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run design:audit
      - run: bun run test:agent
      - name: Check rendered pages and project interactions
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_RENDERED_REPORT_PATH: pr-rendered.md
          QA_PERFORMANCE_REPORT_PATH: pr-performance.json
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$QA_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$QA_BASE_URL" > /dev/null
          status=0
          node scripts/reveal-readiness-qa.mjs || status=1
          bun run qa:project-pages || status=1
          bun run qa:rendered || status=1
          node scripts/responsive-marquee-qa.mjs || status=1
          node scripts/work-loading-qa.mjs || status=1
          node scripts/interaction-qa.mjs || status=1
          node scripts/performance-qa.mjs || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pull-request-verification
          path: |
            pr-rendered.md
            pr-performance.json
            /tmp/preview.log
            qa-diagnostics/
