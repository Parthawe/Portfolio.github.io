name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_NDA_ACCESS_SHA256: ${{ secrets.VITE_NDA_ACCESS_SHA256 }}
      # These values are intentionally public client configuration. The
      # database's row-level policies control what anonymous visitors can do.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_COMMENTS_TABLE: ${{ vars.VITE_COMMENTS_TABLE || 'portfolio_comments' }}
      VITE_EDGE_AI_ENABLED: '1'
      VITE_EDGE_AI_MODEL: 'gemini-3.1-flash-lite'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run design:audit

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Verify rendered production and interactions
        env:
          QA_BASE_URL: https://designwhich.works
          QA_RENDERED_REPORT_PATH: production-rendered.md
        run: |
          node scripts/rendered-site-qa.mjs
          node scripts/interaction-qa.mjs
          node scripts/responsive-marquee-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: production-rendered.md
