name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_NDA_ACCESS_SHA256: ${{ secrets.VITE_NDA_ACCESS_SHA256 }}
      # These values are intentionally public client configuration. The
      # database's row-level policies control what anonymous visitors can do.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_COMMENTS_TABLE: ${{ vars.VITE_COMMENTS_TABLE || 'portfolio_comments' }}
      VITE_EDGE_AI_ENABLED: '1'
      VITE_EDGE_AI_MODEL: 'gemini-3.1-flash-lite'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Validate project intro contract
        run: bun run test:project-intros

      - name: Validate portfolio copy evidence
        run: bun run test:portfolio-copy

      - name: Validate portfolio agent
        run: bun run test:agent

      - name: Validate route normalization
        run: bun run test:routes

      - name: Audit design system
        run: bun run design:audit

      - name: Build production site and static routes
        run: bun run build

      - name: Validate static route entrypoints
        run: bun run test:static-routes

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
